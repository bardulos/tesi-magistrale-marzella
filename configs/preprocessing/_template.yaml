# Template configs/preprocessing/<stage>.yaml — copia un blocco in un file <stage>.yaml.
# Dettagli: docstring di lib/preprocessing/.
status: illustrative   # template, NON dispatchabile: le chiavi duplicate collasserebbero sul blocco verify

# === INGEST ===
# CSV grezzi → Parquet snappy (CSE + UNSW).
stage: ingest
dataset: [cse, unsw]
out_dir: data/parquet

# === INSPECT ===
# Per-column stats (non_zero/zero/min/max) su un CSV grezzo.
stage: inspect
dataset: cse
out_dir: runs/preprocessing/inspect_cse

# === STATS ===
# Statistiche descrittive raw con split benign/malicious (richiede Label).
stage: stats
dataset: cse

# === ENCODE ===
# Parquet grezzo → encoded + feature_types.json (porte, TCP flags, ICMP, DNS).
stage: encode
primary: data/parquet/cse_raw.parquet
out_dir: runs/preprocessing/encode_cse
# schema_from: ...           # schema CSE da applicare a UNSW

# === REDUCE ===
# Encoded → post_audit: droppa 6 feature, aggiunge has_ttl e has_tcp_win_out.
stage: reduce
primary: runs/preprocessing/encode_cse/cse_encoded.parquet
schema_from: runs/preprocessing/encode_cse/feature_types.json
out_dir: runs/preprocessing/reduce_cse

# === TRANSFORM ===
# Post_audit → train/val/test .npz + scaler. Split benigni 80/10/10.
stage: transform
primary: runs/preprocessing/reduce_cse/cse_post_audit.parquet
schema_from: runs/preprocessing/reduce_cse/feature_types_post_audit.json
out_dir: runs/preprocessing/transform_cse
# seed: 42                   # seed per lo split deterministico
# apply_from: ...            # path a transform_cse/ per modalità apply (UNSW)

# === AUDIT ===
# 7 analisi statistiche: Spearman, MI, RF, Wasserstein vs UNSW, varianza, entropia.
stage: audit
primary: runs/preprocessing/reduce_cse/cse_post_audit.parquet
schema_from: runs/preprocessing/reduce_cse/feature_types_post_audit.json
compare: runs/preprocessing/reduce_unsw/unsw_post_audit.parquet
out_dir: runs/preprocessing/audit_cse

# === VERIFY ===
# Duplicati + heatmap correlazione + (opz) checks di robustezza scaler.
stage: verify
primary: runs/preprocessing/reduce_cse/cse_post_audit.parquet
schema_from: runs/preprocessing/reduce_cse/feature_types_post_audit.json
out_dir: runs/preprocessing/verify_cse
# scaler_params: ...         # se presente, abilita i robustness checks
# transform_meta: ...        # idem (entrambi richiesti insieme)
