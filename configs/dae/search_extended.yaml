# Search estesa (+200 trial) su AUC-PR in un output dedicato.
# Warm-start da configurazioni traslate e campioni casuali nella regione nuova.
stage: search
study_name: dae_search
out_dir: runs/dae/search_600

shard_dir: <HOME>/dae_data_91
val_X: <HOME>/dae_data_91/val_X.npy
val_y: <HOME>/dae_data_91/val_y.npy

n_trials: 600
n_new_trials: 200
n_startup_trials: 120
max_concurrent_trials: 80
cpu_per_trial: 1
grace_period: 4
reduction_factor: 2
seed: 42
ray_address: auto
resume: auto
verbose: 1

# Il warm-start importa la storia del DB a 400 e accoda configurazioni traslate e casuali.
warmstart:
  db_path: runs/dae/search_400/optuna_study.db
  study_name: dae_search
  import_history: true
  n_random: 80
  rng_seed: 0

save_weights: true
# Conservare i pesi nella HOME persistente del worker, non in /tmp/ray.
weights_home: <HOME>/repov6_weights

max_epochs: 100
patience: 18
non_learning_margin: 0.05
batch: 512
