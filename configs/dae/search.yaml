# Search DAE su AUC-PR; driver workstation, worker nodo1..5.
# Dry-run: sovrascrivere ray_address=local e usare uno shard piccolo.
stage: search
study_name: dae_search
out_dir: runs/dae/search

shard_dir: <HOME>/dae_data_91
val_X: <HOME>/dae_data_91/val_X.npy
val_y: <HOME>/dae_data_91/val_y.npy

n_trials: 400
n_startup_trials: 75
max_concurrent_trials: 75
cpu_per_trial: 1
grace_period: 4
reduction_factor: 2
seed: 42
ray_address: auto
resume: auto
verbose: 1

max_epochs: 100
patience: 17                    # Provvisorio per dry-run; tarare prima della run finale.
batch: 512
